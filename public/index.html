
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f2" />
  <title>Maintenance — Donate</title>

  <style>
    :root {
      --bg: #f7f7f2;
      --surface: #ffffff;
      --ink: #171717;
      --yellow: #f9e547;
      --green: #b7f7c4;
      --border: 3px solid var(--ink);
      --shadow: 6px 6px 0 var(--ink);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      padding: 24px;
      display: grid;
      place-items: center;
      background-color: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 580px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.3px;
      text-transform: uppercase;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      background: var(--yellow);
      border: 2px solid var(--ink);
      font-size: 17px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 2px solid var(--ink);
      background: var(--green);
      font-size: 10px;
      letter-spacing: 0;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--ink);
      border-radius: 50%;
    }

    .card {
      padding: clamp(24px, 6vw, 42px);
      background: var(--surface);
      border: var(--border);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-block;
      padding: 7px 10px;
      margin-bottom: 23px;
      background: var(--yellow);
      border: 2px solid var(--ink);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .icon-box {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin-bottom: 25px;
      background: var(--yellow);
      border: var(--border);
      box-shadow: 4px 4px 0 var(--ink);
    }

    .icon-box svg {
      width: 42px;
      height: 42px;
    }

    h1 {
      max-width: 460px;
      margin: 0;
      font-size: clamp(36px, 8vw, 58px);
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: -2.8px;
    }

    h1 span {
      display: block;
      margin-top: 8px;
      color: #6b5cff;
    }

    .description {
      margin: 22px 0 0;
      max-width: 390px;
      font-size: 16px;
      line-height: 1.7;
      color: #454545;
    }

    .divider {
      margin: 28px 0;
      border: 0;
      border-top: 2px dashed #b7b7b0;
    }

    .contact-label {
      margin: 0 0 12px;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .contact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px;
      background: var(--green);
      border: var(--border);
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .contact:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--ink);
    }

    .contact:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .arrow {
      flex-shrink: 0;
      font-size: 22px;
    }

    .footer {
      margin-top: 27px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #686868;
    }

    @media (max-width: 380px) {
      body {
        padding: 17px;
      }

      .card {
        padding: 23px 19px;
      }

      .topbar {
        font-size: 11px;
      }

      .contact {
        font-size: 12px;
        padding: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">×</span>
        <span>KAXEL</span>
      </div>

      <span class="status">Maintenance</span>
    </header>

    <section class="card">
      <span class="eyebrow">Sedang dalam perbaikan</span>

      <div class="icon-box" aria-hidden="true">
        <svg
          viewBox="0 0 48 48"
          fill="none"
          stroke="currentColor"
          stroke-width="3.5"
          stroke-linecap="square"
          stroke-linejoin="miter"
        >
          <rect x="7" y="9" width="34" height="25" rx="1" />
          <path d="M3 39H45" />
          <path d="M17 39L19 34H29L31 39" />
          <path d="M18 19L22 23L30 15" />
        </svg>
      </div>

      <h1>
        Website sedang
        <span>maintenance.</span>
      </h1>

      <p class="description">
        Lagi ada yang dibenerin sama admin :)
        <br />
        Harap bersabar ya, kami bakal kembali secepatnya.
      </p>

      <hr class="divider" />

      <p class="contact-label">Butuh bantuan? Hubungi admin</p>

      <a
        class="contact"
        href="https://wa.me/6287767510608"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Hubungi admin melalui WhatsApp"
      >
        <span>WhatsApp Admin ↗</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <footer class="footer">
      © <span id="year"></span> KAXEL — Thanks for your patience.
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
