<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAXEL ADMIN PANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #e2e8f0;
            background-image: radial-gradient(#000 1.25px, transparent 1.25px);
            background-size: 20px 20px;
            color: #000;
            padding: 24px 16px;
        }
        .container { max-width: 980px; margin: 0 auto; }
        .neo-box {
            background: #fff;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            padding: 24px;
            margin-bottom: 24px;
        }
        .title {
            background: #ffde59;
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #000;
            padding: 8px 16px;
            font-size: 24px;
            font-weight: 900;
            display: inline-block;
            margin-bottom: 20px;
        }
        .neo-input {
            width: 100%;
            padding: 12px;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            font-family: inherit;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .neo-btn {
            background: #7ed957;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            padding: 12px 20px;
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            padding: 16px;
        }
        .stat-card h4 { font-size: 13px; text-transform: uppercase; margin-bottom: 8px; }
        .stat-card div { font-size: 26px; font-weight: 900; }
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            border: 3px solid #000;
            font-size: 13px;
        }
        th, td {
            border: 2px solid #000;
            padding: 10px;
            text-align: left;
            font-weight: 700;
        }
        th { background: #ffde59; text-transform: uppercase; font-weight: 900; }
        .badge {
            padding: 3px 8px;
            border: 2px solid #000;
            font-size: 11px;
            text-transform: uppercase;
            display: inline-block;
        }
        .bg-success { background: #7ed957; }
        .bg-pending { background: #ffde59; }
        .bg-cancel { background: #ff5757; color: #fff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loginBox" class="neo-box" style="max-width: 420px; margin: 60px auto;">
            <div class="title">🔒 ADMIN LOGIN</div>
            <form id="loginForm">
                <input type="password" id="adminPass" placeholder="Masukkan Password Admin" required class="neo-input">
                <button type="submit" class="neo-btn" style="width: 100%;">MASUK DASHBOARD</button>
            </form>
        </div>

        <div id="dashboardBox" class="hidden">
            <div class="neo-box" style="background: #5ce1e6; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                <h1 style="font-weight: 900; font-size: 24px;">📊 KAXEL ADMIN DASHBOARD</h1>
                <div style="display: flex; gap: 8px;">
                    <button onclick="fetchAdminData()" class="neo-btn" style="background: #ffde59;">🔄 REFRESH</button>
                    <a href="/" class="neo-btn" style="background: #fff; text-decoration: none; color: #000;">🏠 KE WEB</a>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card" style="background: #c1ff72;">
                    <h4>Total Pendapatan Bersih</h4>
                    <div id="statRevenue">Rp0</div>
                </div>
                <div class="stat-card" style="background: #ffde59;">
                    <h4>Donasi Sukses</h4>
                    <div id="statSuccess">0</div>
                </div>
                <div class="stat-card" style="background: #ff914d;">
                    <h4>Transaksi Pending</h4>
                    <div id="statPending">0</div>
                </div>
            </div>

            <div class="neo-box" style="background: #fff9db;">
                <h3 style="font-weight: 900; margin-bottom: 12px; text-transform: uppercase;">🎯 Atur Target Donasi (Goal Bar)</h3>
                <form id="goalForm" style="display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px; align-items: start;">
                    <input type="text" id="goalTitleInput" placeholder="Judul Target (Misal: Upgrade VPS)" required class="neo-input" style="margin-bottom:0;">
                    <input type="number" id="goalTargetInput" placeholder="1000000" required class="neo-input" style="margin-bottom:0;">
                    <button type="submit" class="neo-btn">SIMPAN</button>
                </form>
            </div>

            <div class="neo-box">
                <h3 style="font-weight: 900; margin-bottom: 16px; text-transform: uppercase;">📋 Riwayat Semua Donasi & Nomor WA</h3>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Waktu</th>
                                <th>ID Trx</th>
                                <th>Nama</th>
                                <th>WhatsApp</th>
                                <th>Nominal</th>
                                <th>Pesan</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let savedPassword = ''
        const formatRp = (num) => 'Rp' + Number(num).toLocaleString('id-ID')

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            savedPassword = document.getElementById('adminPass').value
            await fetchAdminData()
        })

        document.getElementById('goalForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            const title = document.getElementById('goalTitleInput').value
            const target = document.getElementById('goalTargetInput').value
            try {
                const res = await fetch('/api/admin/goal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: savedPassword, title, target })
                })
                const json = await res.json()
                if (json.success) alert('Target donasi berhasil diperbarui!')
            } catch (err) {
                alert('Gagal memperbarui target.')
            }
        })

        const fetchAdminData = async () => {
            try {
                const res = await fetch('/api/admin/stats', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: savedPassword })
                })
                const json = await res.json()

                if (!json.success) {
                    alert(json.message)
                    return
                }

                document.getElementById('loginBox').classList.add('hidden')
                document.getElementById('dashboardBox').classList.remove('hidden')

                if (json.goal) {
                    document.getElementById('goalTitleInput').value = json.goal.title || ''
                    document.getElementById('goalTargetInput').value = json.goal.target || 1000000
                }

                document.getElementById('statRevenue').textContent = formatRp(json.stats.totalRevenue)
                document.getElementById('statSuccess').textContent = json.stats.totalSuccess + ' Trx'
                document.getElementById('statPending').textContent = json.stats.totalPending + ' Trx'

                const tbody = document.getElementById('historyTable')
                if (json.history.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Belum ada transaksi.</td></tr>'
                    return
                }

                tbody.innerHTML = json.history.map(item => {
                    const statusClass = (item.status === 'sukses' || item.status === 'success')
                        ? 'bg-success'
                        : item.status === 'pending' ? 'bg-pending' : 'bg-cancel'

                    const waClean = item.whatsapp ? item.whatsapp.replace(/[^0-9]/g, '') : ''
                    const waLink = waClean
                        ? `<a href="https://wa.me/${waClean}" target="_blank" style="color:#000; background:#c1ff72; padding:2px 6px; border:2px solid #000; text-decoration:none;">📱 ${item.whatsapp}</a>`
                        : '-'

                    return `
                        <tr>
                            <td>${new Date(item.createdAt).toLocaleString('id-ID')}</td>
                            <td style="font-family: monospace;">${item.transactionId}</td>
                            <td>${item.emoji || ''} ${item.name}</td>
                            <td>${waLink}</td>
                            <td>${formatRp(item.amount)}</td>
                            <td>${item.notes}</td>
                            <td><span class="badge ${statusClass}">${item.status}</span></td>
                        </tr>
                    `
                }).join('')
            } catch (e) {
                alert('Gagal mengambil data dari server.')
            }
        }
    </script>
</body>
</html>
